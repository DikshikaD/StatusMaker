name: status_maker
description: "A premium Status Creator App built with Flutter MVVP architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Animations
  google_fonts: ^6.2.1

  # Image handling
  image_picker: ^1.1.2

  # Backend (auth, database, storage)
  supabase_flutter: ^2.12.4

  # Save & Share (canvas export)
  path_provider: ^2.1.0
  share_plus: ^10.0.0

  # Persist user preferences (e.g. language)
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/categories/morning/
    - assets/categories/love/
    - assets/categories/festival/
    - assets/categories/birthday/
    - assets/backgrounds/morning/
    - assets/backgrounds/love/
    - assets/backgrounds/birthday/
    - assets/backgrounds/festival/
    - assets/backgrounds/motivation/
    - assets/backgrounds/devotional/
    - assets/backgrounds/goodnight/
    - assets/backgrounds/general/
