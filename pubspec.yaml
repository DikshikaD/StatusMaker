name: status_maker
description: "A premium Status Creator App built with Flutter MVVP architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI & Animations
  google_fonts: ^6.2.1

  # Image handling
  image_picker: ^1.1.2
  # Disk-backed cache for remote images. Required, not a nicety: category
  # backgrounds are served from Supabase Storage, and Image.network caches only
  # in memory — every app restart would re-download and re-bill the egress.
  cached_network_image: ^3.4.1
  # Used to fetch the background manifest from the public storage endpoint.
  http: ^1.6.0

  # Backend (auth, database, storage)
  supabase_flutter: ^2.12.4

  # Push notifications (someone liked your status) — delivered by FCM so they
  # arrive with the app closed. See supabase/functions/notify-on-like/.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Save & Share (canvas export)
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  # Opens the Play Store listing (Rate us). Already in the tree transitively
  # via supabase_flutter at 6.3.2, so this adds no new resolution.
  url_launcher: ^6.3.0

  # Persist user preferences (e.g. language)
  shared_preferences: ^2.2.0

  # GPU fragment-shader effects (glow, aurora, waves) + a process-wide compiled
  # shader cache. Sampled at a frozen time by the studio's background painter,
  # so every generated background is a still image, never an animation.
  # Dart >=3.0 / Flutter >=3.10 — compatible with this project's SDK.
  flutter_shaders_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Studio background shaders (lib/studio). Compiled at build time by the
  # Flutter tool; loaded once at runtime via StudioShaders.warmUp().
  shaders:
    - shaders/mesh_gradient.frag
    - shaders/light_rays.frag
    - shaders/soft_waves.frag
    - shaders/bokeh.frag
    - shaders/texture_overlay.frag

  assets:
    - assets/images/
    # assets/categories/** is deliberately NOT bundled — those 73 images are
    # served from the public `category-backgrounds` Supabase bucket instead
    # (see lib/features/editor/data/remote_backgrounds.dart). The files are
    # kept in the repo as the source of truth for re-uploads. Bundling them
    # added ~126 MB to the download.
    - assets/backgrounds/morning/
    - assets/backgrounds/love/
    - assets/backgrounds/birthday/
    - assets/backgrounds/festival/
    - assets/backgrounds/motivation/
    - assets/backgrounds/devotional/
    - assets/backgrounds/goodnight/
    - assets/backgrounds/general/
    - assets/stickers/
